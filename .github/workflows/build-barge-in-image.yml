name: Build barge-in Core image

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches:
      - barge-in-2026.10.0
    paths:
      - .github/workflows/build-barge-in-image.yml
      - Dockerfile.barge-in
      - Dockerfile.barge-in-rollback
      - homeassistant/components/esphome/assist_satellite.py
      - homeassistant/components/esphome/wav_parser.py
      - homeassistant/components/tts/__init__.py
      - homeassistant/components/tts/entity.py
      - homeassistant/components/wyoming/assist_satellite.py

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ha-core-barge-in

jobs:
  build:
    name: Build and publish Core images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # To push images to GHCR
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.barge-in
          platforms: linux/amd64
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:2026.10.0
            ${{ env.IMAGE_NAME }}:2026.10.0-bargein1
            ${{ env.IMAGE_NAME }}:latest

      - name: Verify image
        run: |
          docker run --rm --entrypoint python3 "${IMAGE_NAME}:2026.10.0-bargein1" -c '
          from homeassistant.const import __version__
          from homeassistant.components import tts
          from homeassistant.components.esphome import assist_satellite
          from homeassistant.components.wyoming import assist_satellite
          assert __version__ == "2026.10.0", __version__
          assert hasattr(tts.TextToSpeechEntity, "supports_audio_interrupt")
          print(f"Verified Home Assistant {__version__} with barge-in patch")
          '

      - name: Publish verified image
        run: |
          docker push "${IMAGE_NAME}:2026.10.0"
          docker push "${IMAGE_NAME}:2026.10.0-bargein1"
          docker push "${IMAGE_NAME}:latest"

      - name: Build and publish rollback bridge
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.barge-in-rollback
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:2026.10.0-official1
