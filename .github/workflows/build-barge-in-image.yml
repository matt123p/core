name: Build barge-in Core image

on:
  workflow_dispatch:
  push:
    branches:
      - barge-in-2026.9.3
    paths:
      - .github/workflows/build-barge-in-image.yml
      - Dockerfile.barge-in
      - homeassistant/components/esphome/assist_satellite.py
      - homeassistant/components/tts/__init__.py
      - homeassistant/components/tts/entity.py
      - homeassistant/components/wyoming/assist_satellite.py

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ha-core-barge-in

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.barge-in
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:2026.9.3
            ${{ env.IMAGE_NAME }}:latest
